# App
spring.application.name=restaurant-delivery

# Database
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/delivery_db}
spring.datasource.username=${PGUSER:delivery_user}
spring.datasource.password=${PGPASSWORD:delivery_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

# Uber Direct
uber.client-id=${UBER_CLIENT_ID:placeholder}
uber.client-secret=${UBER_CLIENT_SECRET:placeholder}
uber.customer-id=${UBER_CUSTOMER_ID:placeholder}
uber.base-url=https://api.uber.com

# WooCommerce
woocommerce.url=${WOOCOMMERCE_URL:placeholder}
woocommerce.key=${WOOCOMMERCE_KEY:placeholder}
woocommerce.secret=${WOOCOMMERCE_SECRET:placeholder}
woocommerce.webhook-secret=${WOOCOMMERCE_WEBHOOK_SECRET:placeholder}

# Restaurant
restaurant.name=${RESTAURANT_NAME:My Restaurant}
restaurant.address=${RESTAURANT_ADDRESS:placeholder}
restaurant.phone=${RESTAURANT_PHONE:placeholder}