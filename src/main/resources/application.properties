# App
spring.application.name=restaurant-delivery

# Database — works for both local and Railway
spring.datasource.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:delivery_db}
spring.datasource.username=${PGUSER:delivery_user}
spring.datasource.password=${PGPASSWORD:delivery_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.hbm2ddl.auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

# Uber Direct
uber.client-id=${UBER_CLIENT_ID:placeholder}
uber.client-secret=${UBER_CLIENT_SECRET:placeholder}
uber.customer-id=${UBER_CUSTOMER_ID:placeholder}
uber.base-url=https://api.uber.com

# WooCommerce
woocommerce.url=${WOOCOMMERCE_URL:placeholder}
woocommerce.key=${WOOCOMMERCE_KEY:placeholder}
woocommerce.secret=${WOOCOMMERCE_SECRET:placeholder}
woocommerce.webhook-secret=${WOOCOMMERCE_WEBHOOK_SECRET:placeholder}

# Restaurant
restaurant.name=${RESTAURANT_NAME:My Restaurant}
restaurant.address=${RESTAURANT_ADDRESS:placeholder}
restaurant.phone=${RESTAURANT_PHONE:placeholder}

# Uber webhook secret (set this in Uber Developer Dashboard)
uber.webhook-secret=${UBER_WEBHOOK_SECRET:placeholder}

# Dashboard API — shared secret between Vercel proxy and this backend.
# Set DASHBOARD_API_TOKEN in Railway env vars (generate with: openssl rand -hex 32)
dashboard.api.token=${DASHBOARD_API_TOKEN:}